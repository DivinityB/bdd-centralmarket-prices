name: TEST official market
on:
  workflow_dispatch:
    inputs:
      script:
        description: script in TEST/ to run
        default: official_test2.py
concurrency:
  group: test-official
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 ${{ inputs.script }}
        working-directory: TEST
      - name: Save result (only inside TEST/results)
        if: always()
        run: |
          git config user.name "price-test"; git config user.email "price-test@users.noreply.github.com"
          git add TEST/results && git commit -m "TEST result" && git pull -q --rebase && git push || true
