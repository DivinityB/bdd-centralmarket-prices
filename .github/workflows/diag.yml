name: Diagnose api
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          python3 - <<'PY'
          import json, time, fetch_prices as F
          ids = json.load(open("ids.json"))
          old = json.load(__import__("urllib.request").request.urlopen("https://raw.githubusercontent.com/DivinityB/bdd-centralmarket-prices/data/prices-eu.json"))
          z = [int(i) for i in old["n"]][:12]
          print("zero ids sample", z)
          for chunk in (z[:5], z[:10], [9793], [517]):
              for t in range(8):
                  try:
                      arr = F.entries(F.get("https://api.arsha.io/v2/eu/GetWorldMarketSubList?id=%s&lang=en" % ",".join(map(str, chunk)), tries=1)); break
                  except Exception as e:
                      arr = None; time.sleep(2)
              print("chunk", chunk, "->", None if arr is None else [(F.eid(x), x.get("sid"), x.get("basePrice"), x.get("lastSoldPrice")) for x in arr])
          PY
