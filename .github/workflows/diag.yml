name: Diagnose api
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe
        run: |
          B=https://api.arsha.io/v2/eu
          for ids in "9793,9768,517,7907,4901" "9793,9768,517,7907,4901,8198,9001,9002,4925,4986"; do for t in 1 2 3 4 5 6 7 8; do c=$(curl -sS -m 20 -o /tmp/r.json -w "%{http_code}" "$B/GetWorldMarketSubList?id=$ids&lang=en"); [ "$c" = 200 ] && break; sleep 2; done; echo "== $ids HTTP $c"; head -c 1500 /tmp/r.json; echo; done
