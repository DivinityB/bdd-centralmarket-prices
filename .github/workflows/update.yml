name: Update prices
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: prices
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Get the previous data (so a failed fetch keeps old values)
        run: |
          mkdir -p out
          if git fetch -q --depth=1 origin data; then git archive FETCH_HEAD | tar -x -C out; fi
      - name: Check that api.arsha.io answers
        continue-on-error: true
        run: |
          curl -sS -m 20 -o /dev/null -w "single: HTTP %{http_code} in %{time_total}s\n" "https://api.arsha.io/v2/eu/GetWorldMarketSubList?id=4901&lang=en" || true
          curl -sS -m 20 -w "\nbatch: HTTP %{http_code} in %{time_total}s\n" "https://api.arsha.io/v2/eu/GetWorldMarketSubList?id=4901,8198&lang=en" | head -c 600 || true
      - name: Fetch prices
        env:
          REGIONS: eu
        run: python3 fetch_prices.py out
      - name: Publish (branch "data" holds one commit only, no history)
        run: |
          cd out
          git init -q -b data
          git config user.name "price-feed"
          git config user.email "price-feed@users.noreply.github.com"
          git add -A
          git commit -q -m "prices $(date -u +%H:%M)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
