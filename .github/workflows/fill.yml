name: Fill prices (loop)
# Manual helper: repeats the fetch about every 30 seconds for up to 5 hours 50 minutes, so the price list fills up quickly while arsha.io blocks part of the requests.
on: workflow_dispatch
concurrency:
  group: prices
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Loop
        env:
          REGIONS: eu
          DEADLINE_S: "50"
        run: |
          mkdir -p out
          end=$(( $(date +%s) + 350*60 ))
          n=0
          while [ $(date +%s) -lt $end ]; do
            n=$((n+1))
            if git fetch -q --depth=1 origin data 2>/dev/null; then rm -rf out && mkdir out && git archive FETCH_HEAD | tar -x -C out; fi
            python3 fetch_prices.py out | grep -E "^eu:|deadline" || true
            if [ -f out/prices-eu.json ]; then
              ( cd out && rm -rf .git && git init -q -b data && git config user.name price-feed && git config user.email price-feed@users.noreply.github.com && git add -A && git commit -q -m "prices pass $n" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data ) || true
            fi
            sleep 30
          done
